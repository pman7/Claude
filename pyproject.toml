[project]
name = "integra-outbound"
version = "0.1.0"
description = "Integra Dental owned lead database: public dentist records, enrichment, ICP scoring, exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "tenacity>=8.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "phonenumbers>=8.13",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
]

[project.scripts]
integra = "integra.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:integra.*"]
