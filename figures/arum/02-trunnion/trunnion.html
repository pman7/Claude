  const runs = scene ? scene.runs : null;
  const groupOf = (global) => (runs ? runs[global].group : -1);
  const planar = layer.planar;
  for (let p = 0; p < planar.length; p += 5) {
    const i = planar[p];
    const j = planar[p + 1];
    const fi = frames[i];
    const fj = frames[j];
    if (!t3Overlap(fi.box, fj.box, -0.05)) continue;
    const g = groupOf(i);
    const V = g >= 0 ? cams[g].V : cams.world.V;
    const s = planar[p + 2] * V[0] + planar[p + 3] * V[1] + planar[p + 4] * V[2];
    if (s < 1e-7 && s > -1e-7) continue;

    const lj = local.get(j);

  const framed = layer.framed;
  if (framed)
    for (let p = 0; p < framed.length; p += 6) {
      const i = framed[p];
      const j = framed[p + 1];
      if (!t3Overlap(frames[i].box, frames[j].box, -0.05)) continue;
      const g = framed[p + 2];
      const V = g >= 0 ? cams[g].V : cams.world.V;
      const s = framed[p + 3] * V[0] + framed[p + 4] * V[1] + framed[p + 5] * V[2];
      if (s < 1e-7 && s > -1e-7) continue;
      const li = local.get(i);
      const lj = local.get(j);
      if (s > 0) addEdge(li, lj);
      else addEdge(lj, li);
    }
  if (layer.groupPairs)
    for (const gp of layer.groupPairs) {
      const union = (list, box) => {
        box[0] = Infinity;
        box[1] = Infinity;
        box[2] = -Infinity;
        box[3] = -Infinity;
        for (let q = 0; q < list.length; q++) {
          const b = frames[list[q]].box;
          if (b[0] < box[0]) box[0] = b[0];
          if (b[1] < box[1]) box[1] = b[1];
          if (b[2] > box[2]) box[2] = b[2];
          if (b[3] > box[3]) box[3] = b[3];
        }
      };
      union(gp.a, gp.boxA);
      union(gp.b, gp.boxB);
      if (!t3Overlap(gp.boxA, gp.boxB, -0.05)) continue;
      const V = gp.frame >= 0 ? cams[gp.frame].V : cams.world.V;
      const s = gp.n[0] * V[0] + gp.n[1] * V[1] + gp.n[2] * V[2];
      if (s < 1e-7 && s > -1e-7) continue;
      for (let x = 0; x < gp.a.length; x++) {
        const i = gp.a[x];
        const bi = frames[i].box;
        if (!t3Overlap(bi, gp.boxB, -0.05)) continue;
        for (let y = 0; y < gp.b.length; y++) {
          const j = gp.b[y];
          if (!t3Overlap(bi, frames[j].box, -0.05)) continue;
          if (s > 0) addEdge(local.get(i), local.get(j));
          else addEdge(local.get(j), local.get(i));

    }

  let unseparated = 0;
  let solved = 0;
  const rel = layer.rel ?? (layer.rel = new Map());
  const cross = (i, j) => {
    const ri = runs[i];
    const rj = runs[j];
    const ci = ri.group >= 0 ? cams[ri.group] : cams.world;
    const cj = rj.group >= 0 ? cams[rj.group] : cams.world;
    const A = ci.R;
    const B = cj.R;
    const dx = cj.t[0] - ci.t[0];
    const dy = cj.t[1] - ci.t[1];
    const dz = cj.t[2] - ci.t[2];
    const key = i * 65536 + j;
    let memo = rel.get(key);

      rel.set(key, memo);
    }
    const pose = memo.pose;
    let same = memo.fresh;
    let at = 0;
    for (let c = 0; c < 3; c++)
      for (let r = 0; r < 3; r++) {
        const v = A[c] * B[r] + A[3 + c] * B[3 + r] + A[6 + c] * B[6 + r];
        if (same && Math.abs(pose[at] - v) > 1e-12) same = false;
        pose[at++] = v;
      }
    for (let c = 0; c < 3; c++) {
      const v = A[c] * dx + A[3 + c] * dy + A[6 + c] * dz;
      if (same && Math.abs(pose[at] - v) > 1e-9) same = false;
      pose[at++] = v;
    }
    let nx;
    let ny;
    let nz;
    if (same) {
      const n = memo.n;
      nx = A[0] * n[0] + A[1] * n[1] + A[2] * n[2];
      ny = A[3] * n[0] + A[4] * n[1] + A[5] * n[2];
      nz = A[6] * n[0] + A[7] * n[1] + A[8] * n[2];
    } else {

      const prev = lines[(i - 1 + m) % m];

        taken.add(run.index);
        const share = (Math.min(b[2], box[2]) - Math.max(b[0], box[0])) * (Math.min(b[3], box[3]) - Math.max(b[1], box[1]));
        candidates.push({ run, f, share });
      }
    });
  }
  candidates.sort((a, b) => b.share - a.share);
  const parts = [];
  let slot = 0;
  for (const { run, f } of candidates) {
    if (slot >= polygons) break;
    const points = [];
    if (f.quadN) for (const [buf, count] of f.quadList) for (let i = 0; i < count; i++) points.push([buf[2 * i], buf[2 * i + 1]]);
    else for (let i = 0; i < f.hullN; i++) points.push([f.hull[2 * i], f.hull[2 * i + 1]]);
    const lines = t3Enclose(points, edges);
    if (!lines.length) continue;
    lines.forEach((line, e) => {
      const at = (slot * edges + e) * 3;
      uCoverEdge[at] = line[0];
      uCoverEdge[at + 1] = line[1];
      uCoverEdge[at + 2] = line[2] - pad;
    });
    uCoverCount[slot] = lines.length;
    parts.push(run.name);
    slot++;
  }
  return { uCoverEdge, uCoverCount, dropped: Math.max(0, candidates.length - slot), parts };
}

function t3PoseOf(scene, cams, name) {
  const index = scene.groups.findIndex((g) => g.name === name);
  const cam = index >= 0 && cams ? cams[index] : null;
  return { R: cam ? Array.from(cam.R) : Array.from(T3_EYE), t: cam ? [cam.t[0], cam.t[1], cam.t[2]] : [0, 0, 0] };
}

function t3Anchor(scene, cams, name, point, direction) {
  const index = name === null || name === undefined ? -1 : scene.groups.findIndex((g) => g.name === name);
  const cam = index >= 0 ? cams[index] : cams.world;
  const o = index >= 0 ? scene.groups[index].origin : [0, 0, 0];
  const R = cam.R;
  const q = [point[0] - o[0], point[1] - o[1], point[2] - o[2]];
  const world = [R[0] * q[0] + R[1] * q[1] + R[2] * q[2] + cam.t[0], R[3] * q[0] + R[4] * q[1] + R[5] * q[2] + cam.t[1], R[6] * q[0] + R[7] * q[1] + R[8] * q[2] + cam.t[2]];
  const w = cams.world;
  const screen = [w.ox + w.m[0] * world[0] + w.m[1] * world[1] + w.m[2] * world[2], w.oy + w.m[3] * world[0] + w.m[4] * world[1] + w.m[5] * world[2]];
  const out = { world, screen };
  if (direction) out.direction = [R[0] * direction[0] + R[1] * direction[1] + R[2] * direction[2], R[3] * direction[0] + R[4] * direction[1] + R[5] * direction[2], R[6] * direction[0] + R[7] * direction[1] + R[8] * direction[2]];
  return out;
}

function t3FloorOf(scene, name, R = T3_EYE) {
  const index = scene.groups.findIndex((g) => g.name === name);
  let low = Infinity;
  for (const run of scene.runs) {
    if (run.group !== index) continue;
    const c = run.cloud;
    for (let i = 0; i < c.length; i += 3) {
      const z = R[6] * c[i] + R[7] * c[i + 1] + R[8] * c[i + 2];
      if (z < low) low = z;
    }
  }
  return low;
}

function t3Compose(A, B) {
  return Array.from(t3Mul(A, B));
}

function t3PoseUniforms(controller, group, prefix = "uGroup") {
  const scene = controller.scene();
  const index = scene.groups.findIndex((g) => g.name === group);
  const cams = controller.cams();
  const cam = index >= 0 && cams ? cams[index] : null;
  const R = cam ? cam.R : T3_EYE;
  const t = cam ? cam.t : [0, 0, 0];
  const o = index >= 0 ? scene.groups[index].origin : [0, 0, 0];
  const T = [t[0] - (R[0] * o[0] + R[1] * o[1] + R[2] * o[2]), t[1] - (R[3] * o[0] + R[4] * o[1] + R[5] * o[2]), t[2] - (R[6] * o[0] + R[7] * o[1] + R[8] * o[2])];
  return { [`${prefix}X`]: [R[0], R[3], R[6]], [`${prefix}Y`]: [R[1], R[4], R[7]], [`${prefix}Z`]: [R[2], R[5], R[8]], [`${prefix}T`]: T };
}

const ease = (u) => u * u * (3 - 2 * u);

// a stand-in in world space: a box as centre, three axes and half sizes; a cylinder as two end centres and a radius

// the highest point of a stand-in on the vertical line through (x, y), or −Infinity if the line misses it
function topAt(body, x, y) {

  const d = [w[0] - sw * u[0], w[1] - sw * u[1], w[2] - sw * u[2]];

// ---------------------------------------------------------------- five-axis kinematics

// the roughed top before finishing: the roughing ball's terraces, inset from the outline
const TERRACES = [-1.3, -2.6].map((g) => ring(bandOutline(g, 1.2).pts)).join("");
const HOLES = CHANNELS.map((c) => circleAt(c.p, BRIDGE.channel / 2, 18)).join("");
const HOLE_RIMS = CHANNELS.map((c) => circleAt(c.p, BRIDGE.channel / 2 + 0.7, 22)).join("");

const add = (p, v, k) => [p[0] + v[0] * k, p[1] + v[1] * k];
// the swept sides of a prism outline between two depths: one quad per edge facing the viewer (n·sh > 0, or < 0 for a
// pocket's far walls), all wound the same way so the union fills under nonzero
function sides(poly, d0, d1, sh, pick) {
  let out = "";
  for (let i = 0; i < poly.pts.length; i++) {
    if (!pick(i)) continue;
    const p = poly.pts[i];
    const q = poly.pts[(i + 1) % poly.pts.length];
    const quad = [add(p, sh, d0), add(q, sh, d0), add(q, sh, d1), add(p, sh, d1)];
    if (signedArea(quad) < 0) quad.reverse();
    out += ring(quad);
  }
  return out;
}
// lines along the picked edges at one depth, joined into runs
function runs(poly, depth, sh, pick) {
  let out = "";
  let open = false;
  for (let i = 0; i < poly.pts.length; i++) {
    if (!pick(i)) { open = false; continue; }
    const p = add(poly.pts[i], sh, depth);
    const q = add(poly.pts[(i + 1) % poly.pts.length], sh, depth);
    out += open ? `L${pt(q)}` : `M${pt(p)}L${pt(q)}`;
    open = true;
  }
  return out;
}

// Line of sight. A point at p (face coordinates) and depth d shows on screen where the face-level point p + d·sh does;
// on its way up the sight line passes p + k·sh at depth d − k. The line is open while it stays inside the channel's
// opening and, below the bridge's top, outside the bridge. So the deepest a point at p can be and still be seen is the
// distance k1 to where the ray p + k·sh leaves the opening, or k2 + top where it first enters the bridge (a point over
// the bridge itself is open only above the bridge's top).
const segsOf = (pts) => pts.map((a, i) => [a, pts[(i + 1) % pts.length]]);
const MOAT_SEGS = segsOf(MOAT.pts);
const BODY_SEGS = segsOf(BODY.pts);
const insidePoly = (p, pts) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i]; const b = pts[j]; if (a[1] > p[1] !== b[1] > p[1] && p[0] < ((b[0] - a[0]) * (p[1] - a[1])) / (b[1] - a[1]) + a[0]) c = !c; } return c; };
// the first k > 0 where p + k·dir crosses one of the segments (Infinity if none); u holds each segment end's offset
// across the ray's direction, so only segments that straddle p's own offset are tested
function firstHit(p, dir, segs, u) {
  let best = Infinity;
  const up = dir[0] * p[1] - dir[1] * p[0];
  for (let i = 0; i < segs.length; i++) {
    const ua = u[i];
    const ub = u[(i + 1) % segs.length];
    if ((ua > up && ub > up) || (ua < up && ub < up)) continue;
    const [a, b] = segs[i];
    const ex = b[0] - a[0];
    const ey = b[1] - a[1];
    const den = dir[0] * ey - dir[1] * ex;
    if (Math.abs(den) < 1e-12) continue;
    const wx = a[0] - p[0];
    const wy = a[1] - p[1];
    const k = (wx * ey - wy * ex) / den;
    if (k <= 1e-9 || k >= best) continue;
    const t = (wx * dir[1] - wy * dir[0]) / den;
    if (t >= 0 && t <= 1) best = k;
  }
  return best;
}
// the offsets across one direction, worked out once per direction and kept for the last few (the main view, the part
// view and the bur's clip all ask in the same frame); the one used longest ago goes first
const SIGHTS = new Map();
const offsetsFor = (sh) => {
  const key = `${sh[0]} ${sh[1]}`;
  let S = SIGHTS.get(key);
  if (S) SIGHTS.delete(key);
  else {
    if (SIGHTS.size >= 4) SIGHTS.delete(SIGHTS.keys().next().value);
    S = { moat: MOAT.pts.map((q) => sh[0] * q[1] - sh[1] * q[0]), body: BODY.pts.map((q) => sh[0] * q[1] - sh[1] * q[0]), seen: null };
  }
  SIGHTS.set(key, S);
  return S;
};
// (inChannel: the caller knows p is in the channel, off the bridge, so the two inside tests can be skipped)
function sightDepth(p, sh, inChannel = false) {
  if (!inChannel && !insidePoly(p, MOAT.pts)) return 0;
  if (!inChannel && insidePoly(p, BODY.pts)) return BRIDGE.top;
  const o = offsetsFor(sh);
  return Math.min(firstHit(p, sh, MOAT_SEGS, o.moat), firstHit(p, sh, BODY_SEGS, o.body) + BRIDGE.top);
}

// The bur (tip p, axis t, holder frame) goes into the channel through face B: from the face down it shows only as far as
// its sight line stays in the channel. Its cut: the depth below face B where it goes out of sight, and the point on its
// axis there; null when nothing of it is hidden (above the face, turned away, in the open over the magazine or off the
// disc's edge, or in sight all the way to its tip).
function burCut(p, t, sh) {
  const tipDepth = GEO.THICK - p[2];
  if (tipDepth <= 0 || !sh || t[2] < 0.2) return null;
  const at = (e) => { const k = (GEO.THICK - e - p[2]) / t[2]; return [p[0] + k * t[0], p[1] + k * t[1]]; };
  if (sightDepth(at(0), sh) <= 0) return null;
  for (let e = 0.05; e < tipDepth; e += 0.1) {
    if (e >= sightDepth(at(e), sh)) { const cut = Math.max(0, e - 0.05); return { cut, at: at(cut) }; }
  }
  return null;
}

// Connectors, row by row. Each is a small prism across the channel that runs 0.4 into the bridge and 0.4 into the disc.
// Its top face and its two long sides are cut into thin rows, and along each row the stretch that can be seen is worked
// out exactly: the part out in the channel (fixed), less every stretch whose sight line crosses the opening's edge on
// its way up, or the bridge's edge while it is still below the bridge's top.
const cross2 = (u, v) => u[0] * v[1] - u[1] * v[0];
const sub = (u, v) => [u[0] - v[0], u[1] - v[1]];
const lerp = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
// the stretches of the line a→b (as fractions of it) that lie in the channel: inside the opening, outside the bridge
function channelRuns(a, b) {
  const w = sub(b, a);
  const us = [0, 1];
  for (const segs of [MOAT_SEGS, BODY_SEGS]) {
    for (const [e0, e1] of segs) {
      const ev = sub(e1, e0);
      const den = cross2(w, ev);
      if (Math.abs(den) < 1e-12) continue;
      const d = sub(e0, a);
      const u = cross2(d, ev) / den;
      const t = cross2(d, w) / den;
      if (u > 0 && u < 1 && t >= 0 && t <= 1) us.push(u);
    }
  }
  us.sort((x, y) => x - y);
  const out = [];
  for (let i = 0; i + 1 < us.length; i++) {
    if (us[i + 1] - us[i] < 1e-9) continue;
    const m = lerp(a, b, (us[i] + us[i + 1]) / 2);
    if (!insidePoly(m, MOAT.pts) || insidePoly(m, BODY.pts)) continue;
    if (out.length && us[i] - out[out.length - 1][1] < 1e-9) out[out.length - 1][1] = us[i + 1];
    else out.push([us[i], us[i + 1]]);
  }
  return out;
}
const CONN_ROWS = 12;
const SIDE_ROWS = 6;
// a connector's quad runs a (bridge side) → b (disc side) along one long edge and e → f back along the other; rows run
// parallel to a→b at fractions v of the way from a to f (the long sides are the rows at v = 0 and v = 1)
const CONN_PARTS = CONN.map((c) => {
  const [a, b, e, f] = c.quad;
  const row = (v) => [lerp(a, f, v), lerp(b, e, v)];
  const top = Array.from({ length: CONN_ROWS }, (_, j) => ({ v: (j + 0.5) / CONN_ROWS, runs: channelRuns(...row((j + 0.5) / CONN_ROWS)), lo: row(j / CONN_ROWS), hi: row((j + 1) / CONN_ROWS) }));
  const long = [{ s: 0, v: 0 }, { s: 2, v: 1 }].map((x) => ({ ...x, line: row(x.v), runs: channelRuns(...row(x.v)) }));
  return { top, long };
});
// runs less the union of the cut intervals
function minus(runs, cut) {
  cut.sort((x, y) => x[0] - y[0]);
  const out = [];
  for (const [r0, r1] of runs) {
    let u = r0;
    for (const [c0, c1] of cut) {
      if (c1 <= u) continue;
      if (c0 >= r1) break;
      if (c0 > u) out.push([u, c0]);
      u = Math.max(u, c1);
      if (u >= r1) break;
    }
    if (u < r1) out.push([u, r1]);
  }
  return out.filter(([u0, u1]) => u1 - u0 > 1e-4);
}
// fallback for a sight line running along the rows: sample each row, then pin each change down
function sampledRuns(A, B, runs, d, sh) {
  const open = (u) => sightDepth(lerp(A, B, u), sh, true) > d;
  const out = [];
  for (const [r0, r1] of runs) {
    const N = 24;
    let prev = open(r0);
    let start = prev ? r0 : null;
    for (let i = 1; i <= N; i++) {
      const u = r0 + ((r1 - r0) * i) / N;
      const now = open(Math.min(u, r1 - 1e-9));
      if (now === prev) continue;
      let lo = r0 + ((r1 - r0) * (i - 1)) / N;
      let hi = u;
      for (let k = 0; k < 12; k++) { const m = (lo + hi) / 2; if (open(m) === prev) lo = m; else hi = m; }
      if (now) start = hi;
      else { out.push([start, lo]); start = null; }
      prev = now;
    }
    if (start !== null) out.push([start, r1]);
  }
  return out;
}
// The seen parts of every connector for one view: top faces and the long sides facing the viewer, painted over the
// bridge's walls (what the bridge hides of them is already cut away here). A sight line from the row at v, at the point a
// fraction u along it, passes that point + k·sh; in a connector's own (u, k) frame every edge of the opening and the
// bridge is a segment, and the part of it within the blocking range of k casts its u-range as cut off.
function connectorsSeen(sh) {
  const conn = { top: "", side: "" };
  for (const [ci, c] of CONN.entries()) {
    const part = CONN_PARTS[ci];
    const [a, b, , f] = c.quad;
    const w = sub(b, a);
    const fv = sub(f, a);
    const det = cross2(w, sh);
    const along = Math.abs(det) < 1e-9 * (Math.hypot(w[0], w[1]) * Math.hypot(sh[0], sh[1]) + 1e-12);
    // moving to the row at v shifts every edge by −v·du in u and −v·dk in k
    const du = along ? 0 : cross2(fv, sh) / det;
    const dk = along ? 0 : cross2(w, fv) / det;
    const frame = (segs, kmax) => {
      const out = [];
      if (along || kmax <= 0) return out;
      for (const [e0, e1] of segs) {
        const r0 = sub(e0, a);
        const r1 = sub(e1, a);
        const u0 = cross2(r0, sh) / det;
        const u1 = cross2(r1, sh) / det;
        const k0 = cross2(w, r0) / det;
        const k1 = cross2(w, r1) / det;
        if (Math.max(u0, u1) - Math.min(0, du) < 0 || Math.min(u0, u1) - Math.max(0, du) > 1) continue;
        if (Math.max(k0, k1) - Math.min(0, dk) < 0 || Math.min(k0, k1) - Math.max(0, dk) > kmax) continue;
        out.push([u0, k0, u1, k1]);
      }
      return out;
    };
    const moat = frame(MOAT_SEGS, c.depth[1]);
    const body = frame(BODY_SEGS, c.depth[1] - BRIDGE.top);
    const seenAt = (v, line, runs, d) => {
      if (!runs.length) return runs;
      if (along) return sampledRuns(line[0], line[1], runs, d, sh);
      const cut = [];
      const cast = (list, hi) => {
        if (hi <= 0) return;
        const su = v * du;
        const sk = v * dk;
        for (const [u0, k0, u1, k1] of list) {
          const ka = k0 - sk;
          const kb = k1 - sk;
          let t0 = 0;
          let t1 = 1;
          if (Math.abs(kb - ka) < 1e-12) { if (ka < 0 || ka > hi) continue; }
          else {
            const ta = -ka / (kb - ka);
            const tb = (hi - ka) / (kb - ka);
            t0 = Math.max(0, Math.min(ta, tb));
            t1 = Math.min(1, Math.max(ta, tb));
            if (t0 > t1) continue;
          }
          const ua = u0 + (u1 - u0) * t0 - su;
          const ub = u0 + (u1 - u0) * t1 - su;
          cut.push(ua < ub ? [ua, ub] : [ub, ua]);
        }
      };
      cast(moat, d);
      cast(body, d - BRIDGE.top);
      return minus(runs, cut);
    };
    for (const row of part.top) {
      for (const [u0, u1] of seenAt(row.v, [lerp(row.lo[0], row.hi[0], 0.5), lerp(row.lo[1], row.hi[1], 0.5)], row.runs, c.depth[0])) {
        const q = [lerp(row.lo[0], row.lo[1], u0), lerp(row.lo[0], row.lo[1], u1), lerp(row.hi[0], row.hi[1], u1), lerp(row.hi[0], row.hi[1], u0)].map((p) => add(p, sh, c.depth[0]));
        if (signedArea(q) < 0) q.reverse();
        conn.top += ring(q);
      }
    }
    for (const side of part.long) {
      if (!(c.n[side.s][0] * sh[0] + c.n[side.s][1] * sh[1] > 1e-6)) continue;
      const [A, B] = side.line;
      for (let j = 0; j < SIDE_ROWS; j++) {
        const d0 = c.depth[0] + ((c.depth[1] - c.depth[0]) * j) / SIDE_ROWS;
        const d1 = c.depth[0] + ((c.depth[1] - c.depth[0]) * (j + 1)) / SIDE_ROWS;
        for (const [u0, u1] of seenAt(side.v, side.line, side.runs, (d0 + d1) / 2)) {
          const q = [add(lerp(A, B, u0), sh, d0), add(lerp(A, B, u1), sh, d0), add(lerp(A, B, u1), sh, d1), add(lerp(A, B, u0), sh, d1)];
          if (signedArea(q) < 0) q.reverse();
          conn.side += ring(q);
        }
      }
    }
  }
  return conn;
}

// which walls the finishing passes have reached: each edge of the outline belongs to the buccal pass (the buccal side and
// the right-hand end) or the palatal pass (the palatal side and the left-hand end)
const finishedEdge = (i, done) => (done[WALL_REACH.pass[i]] ?? 0) >= WALL_REACH.at[i] - 1e-9;

// Everything that moves with the view and the job. sh: depth shift per mm (disc frame); done: the passes' progress;
// lit(n): whether a wall with outward normal n faces the light.
function workShapes(sh, done, lit) {
  const facing = (poly, sign = 1) => (i) => sign * (poly.n[i][0] * sh[0] + poly.n[i][1] * sh[1]) > 1e-6;
  const bodyFacing = facing(BODY);
  // how deep each facing wall's corner can be seen: measured from a step up its sight line (clear of the wall the line
  // starts on), plus that step
  const cache = offsetsFor(sh);
  const fromCorner = (p) => sightDepth(add(p, sh, 0.03), sh, true) + 0.03;
  if (!cache.seen) {
    cache.seen = BODY.pts.map((p, i) => (bodyFacing(i) || bodyFacing((i + BODY.pts.length - 1) % BODY.pts.length) ? Math.max(BRIDGE.top, Math.min(BRIDGE.base, fromCorner(p))) : BRIDGE.top));
    cache.moatSeen = MOAT.pts.map(fromCorner);
  }
  const seen = cache.seen;
  const body = { roughLit: "", roughShade: "", finLit: "", finShade: "" };
  const n = BODY.pts.length;
  for (let i = 0; i < n; i++) {
    if (!bodyFacing(i)) continue;
    const j = (i + 1) % n;
    if (seen[i] <= BRIDGE.top + 1e-6 && seen[j] <= BRIDGE.top + 1e-6) continue;
    const p = BODY.pts[i];
    const q = BODY.pts[j];
    const quad = [add(p, sh, BRIDGE.top), add(q, sh, BRIDGE.top), add(q, sh, seen[j]), add(p, sh, seen[i])];
    if (signedArea(quad) < 0) quad.reverse();
    body[`${finishedEdge(i, done) ? "fin" : "rough"}${lit(BODY.n[i]) ? "Lit" : "Shade"}`] += ring(quad);
  }
  const roughFacing = (i) => bodyFacing(i) && !finishedEdge(i, done);
  const bodySteps = STEP_DEPTHS.map((d) => runs(BODY, d, sh, (i) => roughFacing(i) && d < Math.min(seen[i], seen[(i + 1) % n]))).join("");
  // the channel's far walls, swept all the way down: the floor seen inside the opening lies behind one of them, so
  // painting them over the void keeps it from showing through; their roughing steps only as deep as each can be seen
  // (the bridge's walls and the connectors carry their own line of sight)
  const moatFar = facing(MOAT, -1);
  const moatWalls = sides(MOAT, 0, THROUGH, sh, moatFar);
  const moatSeen = cache.moatSeen;
  const moatSteps = MOAT_STEPS.map((d) => runs(MOAT, d, sh, (i) => moatFar(i) && d < Math.min(moatSeen[i], moatSeen[(i + 1) % MOAT.pts.length]))).join("");
  return {
    floor: `translate(${n2(sh[0] * THROUGH)} ${n2(sh[1] * THROUGH)})`,
    top: `translate(${n2(sh[0] * BRIDGE.top)} ${n2(sh[1] * BRIDGE.top)})`,
    moatWalls,
    moatSteps,
    body,
    bodySteps,
    // the connectors only when asked for (the part view has none)
    get conn() { return (cache.conn ??= connectorsSeen(sh)); },
    reveal: n2(REVEAL.len * (1 - done.occlusal)),
  };
}

// the markup, with each live piece tagged data-w so live.js can find it; filled for one view and state
function workSvg(sh, done, lit, id = "tr") {
  const w = workShapes(sh, done, lit);
  const P = (k, cls, d, extra = "") => `<path data-w="${k}" class="${cls}"${extra} d="${d}"/>`;
  const box = 'maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120"';
  const stroke = `class="tr-reveal" fill="none" stroke-width="${REVEAL.width}" stroke-dasharray="${REVEAL.len} ${REVEAL.len}" d="${REVEAL.d}"`;
  return (
    `<g class="tr-work" transform="scale(-1 -1)">` +
    `<defs><clipPath id="${id}-open"><path d="${OPEN_D}"/></clipPath>` +
    `<mask id="${id}-fin" ${box}><path data-w="reveal" stroke="#fff" ${stroke} stroke-dashoffset="${w.reveal}"/></mask>` +
    `<mask id="${id}-raw" ${box}><rect x="-60" y="-60" width="120" height="120" fill="#fff"/><path data-w="reveal" stroke="#000" ${stroke} stroke-dashoffset="${w.reveal}"/></mask></defs>` +
    `<path class="tr-disc" fill-rule="evenodd" d="${circleAt([0, 0], DISC_FACE, 96)}${OPEN_D}"/>` +
    `<g clip-path="url(#${id}-open)">` +
    `<path class="tr-moat" d="${OPEN_D}"/>` +
    P("floor", "tr-void", OPEN_D, ` transform="${w.floor}"`) +
    P("moatWalls", "tr-moat", w.moatWalls) +
    P("moatSteps", "iso-line", w.moatSteps, ' data-tone="faint" data-free="both"') +
    P("roughShade", "tr-wall tr-rough", w.body.roughShade) +
    P("roughLit", "tr-wall tr-rough", w.body.roughLit, ' data-lit=""') +
    P("finShade", "tr-wall tr-fin", w.body.finShade) +
    P("finLit", "tr-wall tr-fin", w.body.finLit, ' data-lit=""') +
    P("bodySteps", "iso-line", w.bodySteps, ' data-tone="faint" data-free="both"') +
    P("connSide", "tr-conn-side", w.conn.side) +
    P("connTop", "tr-conn", w.conn.top) +
    `<g data-w="top" transform="${w.top}">` +
    `<path class="tr-top" d="${BODY_D}"/>` +
    `<g mask="url(#${id}-raw)"><path class="iso-line" data-tone="faint" d="${TERRACES}"/></g>` +
    `<g mask="url(#${id}-fin)"><path class="tr-crowns" d="${anatomy.dots}"/><path class="iso-line" data-tone="lo" d="${anatomy.outlines}"/><path class="iso-line" data-tone="lo" data-free="both" d="${anatomy.lines}"/></g>` +
    `<path class="tr-hole" d="${HOLES}"/><path class="iso-line" data-tone="faint" d="${HOLE_RIMS}"/>` +
    `<path class="iso-line" data-tone="mid" d="${BODY_D}"/>` +
    `</g></g>` +
    `<path class="iso-line" data-tone="lit" d="${circleAt([0, 0], DISC_FACE, 96)}"/>` +
    `<path class="iso-line" data-tone="lo" d="${OPEN_D}"/>` +
    `</g>`
  );
}

// face A (the underside at A = 0): the channel goes through, so the bridge's intaglio side shows in it, held by the
// connectors; drawn flat (that face is only seen when the holder is turned over)
function underSvg() {
  // face A's u and v are face B's, so the same disc frame holds
  const flipped = (pts) => pts;
  return (
    `<g class="tr-work" transform="scale(-1 -1)">` +
    `<path class="tr-disc" fill-rule="evenodd" d="${circleAt([0, 0], 49.25, 96)}${ring(flipped(MOAT.pts))}"/>` +
    `<path class="tr-void" d="${ring(flipped(MOAT.pts))}"/>` +
    `<path class="tr-conn" d="${CONN.map((c) => ring(flipped(c.quad))).join("")}"/>` +
    `<path class="tr-top" d="${ring(flipped(BODY.pts))}"/>` +
    `<path class="tr-hole" d="${CHANNELS.map((c) => { const k = (BRIDGE.base - BRIDGE.top) / c.axis[2]; return circleAt([c.p[0] - k * c.axis[0], c.p[1] - k * c.axis[1]], BRIDGE.channel / 2 + 0.6, 18); }).join("")}"/>` +
    `<path class="iso-line" data-tone="mid" d="${ring(flipped(BODY.pts))}"/>` +
    `<path class="iso-line" data-tone="lit" d="${circleAt([0, 0], 49.25, 96)}"/>` +
    `</g>`

  else if (sim && s && (trState.playing || trState.time > 0)) text = s.say || readoutOf(trState.cur);
  else if (sim) text = "Finishing a full-arch bridge";
  else text = `${trState.axis} · ${ax.name} · ${v[trState.axis]}${ax.unit === "millimetres" ? " mm" : ""}`;
  if (trReadout.textContent !== text) trReadout.textContent = text;
  // during the passes every axis moves together; in the tool change, Y and Z
  const running = sim && s && (trState.playing || trState.blend);
  for (const btn of trButtons) {
    const moving = Boolean(running && (s.axis === "all" || (s.axis ?? "").includes(btn.dataset.axis.toLowerCase())));
    if (btn.hasAttribute("data-moving") !== moving) btn.toggleAttribute("data-moving", moving);
    const on = !sim && btn.dataset.axis === trState.axis;
    if ((btn.getAttribute("aria-pressed") === "true") !== on) btn.setAttribute("aria-pressed", String(on));
  }
  const setAttr = (el, name, val) => { if (el && el.getAttribute(name) !== val) el.setAttribute(name, val); };
  setAttr(trSimButton, "aria-pressed", String(sim));
  setAttr(trJogButton, "aria-pressed", String(!sim));
  // the play button reads as playing while the job runs or is about to start on its own
  const playing = sim && (trState.playing || trIdle !== 0);
  const label = playing ? "Pause" : "Play";
  if (trPlayButton && trPlayButton.textContent !== label) trPlayButton.textContent = label;
  setAttr(trStage, "data-mode", trState.mode);
  setAttr(trWrap, "data-mode", trState.mode);
  const close = sim && trState.viewTo === 1;
  if (trWrap && trWrap.hasAttribute("data-close") !== close) trWrap.toggleAttribute("data-close", close);
  if (trLineHead) {
    const pct = `${((100 * trState.time) / SIM_LEN).toFixed(2)}%`;
    if (trLineHead.style.left !== pct) trLineHead.style.left = pct;
  }
}
// the slider names what it moves: in the job, the time through it; in jog, the chosen axis
const trValueOf = (axis, s) => {
  const ax = TR_AXES[axis];
  const v = s[ax.key];
  return ax.key === "a" ? trHalfTurn(v) : ax.sign * v;
};
const trWords = (axis, s) => {
  const ax = TR_AXES[axis];
  const n = Math.round(trValueOf(axis, s) * 10) / 10 || 0;
  const rest = {
    X: Math.abs(s.x - HOME.x) < 0.05 ? "disc centre under the spindle" : s.x < HOME.x ? "cradle toward the back" : "cradle toward the operator",
    Y: s.y < 12 ? "spindle over the tool sensor" : s.y < 125 ? "spindle over the magazine" : Math.abs(s.y - HOME.y) < 0.05 ? "spindle over the disc centre" : "spindle over the work",
    Z: s.z < 0.05 ? "head at the top" : "head down",
    A: "holder turned",
    B: "cradle tilted",
  }[axis];
  return `${axis} ${n} ${ax.unit}, ${rest}`;
};
function trDescribe() {
  const set = (name, val) => { if (trStage.getAttribute(name) !== val) trStage.setAttribute(name, val); };
  if (trState.mode === "sim") {
    const s = trState.sim ?? simAt(trState.time);
    const pass = s.kind ? `${TR_PASS[s.kind]}, ` : "";
    set("aria-label", "Milling simulation: finishing a full-arch bridge");
    set("aria-valuemin", "0");
    set("aria-valuemax", String(Math.round(SIM_LEN)));
    set("aria-valuenow", String(Math.round(trState.time)));
    set("aria-valuetext", `${pass}${Math.round(trState.time)} of ${Math.round(SIM_LEN)} seconds; ${wordsOf(trState.cur)}`);
    return;
  }
  const ax = TR_AXES[trState.axis];
  set("aria-label", `${trState.axis} axis, ${ax.name}`);
  set("aria-valuemin", String(ax.sign < 0 ? -ax.hi : ax.lo));
  set("aria-valuemax", String(ax.sign < 0 ? -ax.lo : ax.hi));
  set("aria-valuenow", String(Math.round(trValueOf(trState.axis, trState.want) * 10) / 10 || 0));
  set("aria-valuetext", trWords(trState.axis, trState.want));
}

function trDraw() {
  if (trState.held) return;
  trOwn = true;
  const c = trState.cur;
  // page values; the controller applies follow() to turn the magazine sequence and row into the magazine and flap groups
  const stats = trController.set({ x: c.x, y: c.y, z: c.z, a: c.a, b: c.b, m: c.m, row: c.row ?? 0 });
  trOwn = false;
  if (stats && typeof stats.ms === "number") trEma = trEma ? trEma * 0.9 + stats.ms * 0.1 : stats.ms;
  trWork();
  trInsetUpdate();
  trBurClip();
  trTools();
  trShow();
}

// ---------------------------------------------------------------- jog: the reader moves one axis at a time
// ask for a new value on one axis: the head must fit at that state at least at the top, so back off toward the current
// request when it would not; Z never asks for deeper than the state allows
function trRequest(axis, value) {
  const ax = TR_AXES[axis];
  trState.want = jogRequest(trState.want, ax.key, value, ax.lo, ax.hi);
  trState.mWant = magFor(trState.want.y, trState.want.b);
}

// ---------------------------------------------------------------- the job: play, pause, seek, and the two modes
function trStartJob(asked = false) {
  clearTimeout(trIdle);
  trIdle = 0;
  // the reader's own Play (button or Space) always plays; only starting on its own waits for a calm, unfocused page
  if (!asked && (trCalm || trState.focused || trState.dragging || trState.held || trState.stopped)) { trShow(); return; }
  if (trState.mode !== "sim") trEnterSim();
  if (trState.time >= SIM_LEN - 1e-6) trState.time = 0;
  trState.playing = true;
  trState.asked = asked;
  trViewGo(trViewFor(trState.time));
  trShow();
  trRun();
}
function trArmJob(delay = 3600) {
  clearTimeout(trIdle);
  trIdle = 0;
  // (a job already playing, the reader's own included, just carries on)
  if (trState.playing || trState.mode !== "sim" || trCalm || trState.focused || trState.dragging || trState.held || trState.stopped) { trShow(); return; }
  trIdle = setTimeout(() => trStartJob(), delay);
  trShow();
}
function trPause({ sticky = true } = {}) {
  trState.held = false;
  if (sticky) trState.stopped = true;
  trState.playing = false;
  clearTimeout(trIdle);
  trIdle = 0;
  trShow();
}
// back into the job from wherever jog left the machine: lift, then blend into the job at the start of the pass that
// was running (above the part), so the bur never drops into it on the way
function trEnterSim() {
  trState.mode = "sim";
  trState.lifting = false;
  trState.time = simPassStart(trState.time);
  trState.blend = { from: { ...trState.cur }, t: 0 };
  trViewGo(trViewFor(trState.time));
  trDescribe();
  trDescribed = "";
  trShow();
  trRun();
}
function trEnterJog() {
  if (trState.mode === "jog") return;
  trPause({ sticky: true });
  trState.mode = "jog";
  trState.blend = null;
  // the bur may be in the part: it rises straight up, along the upright tool, before anything else moves
  Object.assign(trState, jogEnter(trState.cur));
  trViewGo(0);
  trDescribe();
  trShow();
  trRun();
}
// a seek from the timeline is spoken; one from the keys or a drag on the focused slider is read from its value text
function trSeek(time, speak = document.activeElement !== trStage) {
  trState.asked = true;
  if (trState.mode !== "sim") trEnterSim();
  trPause({ sticky: true });
  trState.blend = null;
  trState.time = trClamp(time, 0, SIM_LEN);
  trViewGo(trViewFor(trState.time));
  trSimDraw();
  trDescribe();
  if (speak) trSay(true);
  trRun();
}
function trSimDraw() {
  const s = simAt(trState.time);
  trState.sim = s;
  trState.done = s.done;
  trState.tool = s.tool;
  trState.cur = { x: s.x, y: s.y, z: s.z, a: s.a, b: s.b, m: s.m, row: s.row };
}
// the view stands back for the tool change, and comes in close on the work for the passes
function trViewFor(time) { return simAt(time).kind === "tool" ? 2 : 1; }

function trTick(now) {
  const dt = trLast ? Math.min((now - trLast) / 1000, 1 / 30) : 1 / 60;
  trLast = now;
  const calm = trCalm;
  const c = trState.cur;
  let next;
  let changed = false;
  let busy = false;
  if (trState.mode === "sim") {
    if (trState.blend) {
      // up first, across at the top, then down into the job: 0.6 s, 1.2 s and 0.6 s. The magazine and the cradle keep the
      // interlock: going in, the magazine indexes home while the head rises, goes in over the first half of the crossing,
      // and the cradle tilts over the second; coming out, the cradle levels first, then the magazine comes out, and it
      // indexes while the head goes down
      const bl = trState.blend;
      bl.t += calm ? 3 : dt;
      const p = simAt(trState.time);
      const f = bl.from;
      const k1 = trSmooth(bl.t / 0.6);
      const k2 = trSmooth((bl.t - 0.6) / 1.2);
      const k3 = trSmooth((bl.t - 1.8) / 0.6);
      const first = trSmooth((bl.t - 0.6) / 0.6);
      const second = trSmooth((bl.t - 1.2) / 0.6);
      const inward = p.m >= f.m;
      const lerp = (u, v, k) => u + (v - u) * k;
      next = { x: lerp(f.x, p.x, k2), y: lerp(f.y, p.y, k2), z: lerp(lerp(f.z, 0, k1), p.z, k3), a: wrap(f.a + wrap(p.a - f.a) * k2), b: lerp(f.b, p.b, inward ? second : first), m: lerp(f.m, p.m, inward ? first : second), row: lerp(f.row ?? 0, p.row, inward ? k1 : k3) };
      // the head keeps clear of everything on the way, the uncut disc face included (it may start in a cut, lifting:
      // then it only rises until it is clear)
      const room = trRoom(next, next.m);
      if (next.z > room && next.z > c.z) next.z = Math.max(c.z, room);
      trState.sim = { ...p, say: "" };
      trState.tool = p.tool;
      if (bl.t >= 2.4) trState.blend = null;
      trState.cur = next;
      busy = true;
    } else {
      if (trState.playing) {
        trState.time += dt;
        // the job loops: a short hold on the finished bridge is part of its last step
        if (trState.time >= SIM_LEN) trState.time = 0;
        trViewGo(trViewFor(trState.time));
        busy = true;
      }
      trSimDraw();
    }
  } else {
    trState.sim = null;
    const step = jogStep({ cur: c, want: trState.want, mWant: trState.mWant, lifting: trState.lifting }, calm ? 1 : 1 - Math.exp(-dt / 0.18), calm ? 1 : dt / 1.0);
    trState.cur = step.cur;
    trState.want = step.want;
    trState.lifting = step.lifting;
    changed = step.changed;
    busy = step.busy;
  }
  // the view eases between the whole chamber, the work and the magazine over about a second
  if (trViewStep(dt)) busy = true;
  // half rate on slow devices: alternate frames once renders average over 14 ms, every frame again under 9 ms
  if (trEma > 14) trHalf = true;
  else if (trEma < 9) trHalf = false;
  trSkip = trHalf ? !trSkip : false;
  if (!trSkip || !busy) trDraw();
  if (changed || !busy) trDescribe();
  else if (trState.mode === "sim" && trState.playing) trSay();
  trFrame = trVisible && busy ? requestAnimationFrame(trTick) : 0;
}
const trRun = () => { if (!trFrame && trVisible) { trLast = 0; trFrame = requestAnimationFrame(trTick); } };

function trSelect(axis) {
  if (!TR_AXES[axis]) return;
  trEnterJog();
  trState.axis = axis;
  trDescribe();
  trShow();
}
// jog the chosen axis by `delta` in its displayed sense (up and right raise the value, as on any slider)
function trJog(axis, delta) {
  trSelect(axis);
  const ax = TR_AXES[axis];
  trRequest(axis, trState.want[ax.key] + ax.sign * delta);
  trDescribe();
  trRun();
}
// Home and End go to the low and high ends of the value as shown (for Z the low end is the deepest)
function trSetEnd(axis, high) {
  trSelect(axis);
  // A turns all the way round: its two ends are the same place
  if (axis === "A") return;
  const ax = TR_AXES[axis];
  trRequest(axis, high !== ax.sign < 0 ? ax.hi : ax.lo);
  trDescribe();
  trRun();
}
const trNextPass = (dir) => {
  const starts = [0, ...SIM_SPANS.map((span) => span.start), SIM_LEN];
  const t = trState.time;
  if (dir > 0) return starts.find((s) => s > t + 0.05) ?? SIM_LEN;
  return [...starts].reverse().find((s) => s < t - 0.05) ?? 0;
};

new IntersectionObserver((entries) => { trVisible = entries[entries.length - 1].isIntersecting; if (trVisible) trRun(); }, { rootMargin: "120px 0px" }).observe(trStage);

// the axis buttons hand the chosen axis to the reader (jog); the mode buttons switch between the job and jog
for (const btn of trButtons) btn.addEventListener("click", () => trSelect(btn.dataset.axis));
trSimButton?.addEventListener("click", () => { if (trState.mode === "sim") return; trState.stopped = false; trState.held = false; trEnterSim(); trStartJob(true); });
trJogButton?.addEventListener("click", () => trEnterJog());
trPlayButton?.addEventListener("click", () => {
  if (trState.mode === "sim" && (trState.playing || trIdle !== 0)) { trPause(); return; }
  trState.stopped = false;
  trState.held = false;
  trStartJob(true);
});
// the timeline under the stage: click or drag along it to seek
if (trLine) {
  const seekAt = (event) => { const r = trLine.getBoundingClientRect(); trSeek(((event.clientX - r.left) / r.width) * SIM_LEN, true); };
  trLine.addEventListener("pointerdown", (event) => { if (event.button !== 0 && event.pointerType === "mouse") return; trLine.setPointerCapture?.(event.pointerId); seekAt(event); });
  trLine.addEventListener("pointermove", (event) => { if (trLine.hasPointerCapture?.(event.pointerId)) seekAt(event); });
}

// drag: in the job, sideways scrubs through it; in jog, Y and A follow the pointer sideways and X, Z and B a mouse up and
// down (down brings the cradle forward, lowers the head and tilts B negative). A touch drag works sideways only, and only
// once it is clearly sideways, so a page scroll that starts on the figure scrolls and leaves the job alone.
const TR_DRAG = { X: ["y", 220], Y: ["x", 400], Z: ["y", 200], A: ["x", 360], B: ["y", -90] };
function trBegin(event) {
  if (trState.mode === "sim") trPause();
  const ax = TR_AXES[trState.axis];
  trState.dragging = { id: event.pointerId, touch: event.pointerType === "touch", x: event.clientX, y: event.clientY, start: trState.mode === "sim" ? trState.time : trState.want[ax.key] };
  trStage.setAttribute("data-drag", "");
  trStage.setPointerCapture?.(event.pointerId);
}
function trRelease(event) {
  if (trState.pending && event.pointerId === trState.pending.id) trState.pending = null;
  const d = trState.dragging;
  if (!d || event.pointerId !== d.id) return;
  trState.dragging = null;
  trStage.removeAttribute("data-drag");
  if (trStage.hasPointerCapture?.(event.pointerId)) trStage.releasePointerCapture(event.pointerId);
  trDescribe();
}
trStage.addEventListener("pointerdown", (event) => {
  if (!event.isPrimary || trState.dragging) return;
  if (event.pointerType === "touch") { trState.pending = { id: event.pointerId, x: event.clientX, y: event.clientY }; return; }
  if (event.button !== 0) return;
  trBegin(event);
});
trStage.addEventListener("pointermove", (event) => {
  const p = trState.pending;
  if (p && event.pointerId === p.id) {
    const dx = event.clientX - p.x;
    const dy = event.clientY - p.y;
    if (Math.abs(dx) >= 8 && Math.abs(dx) > Math.abs(dy)) {
      trState.pending = null;
      trBegin(event);
    } else if (Math.abs(dy) >= 8) trState.pending = null;
    return;
  }
  const d = trState.dragging;
  if (!d || event.pointerId !== d.id) return;
  if (event.pointerType === "mouse" && event.buttons === 0) { trRelease(event); return; }
  const box = trStage.getBoundingClientRect();
  if (trState.mode === "sim") {
    trSeek(d.start + ((event.clientX - d.x) / box.width) * SIM_LEN);
    return;
  }
  const [dir, span] = TR_DRAG[trState.axis];
  const ax = TR_AXES[trState.axis];
  // a sideways touch drag raises the value to the right, like the right arrow
  const along = d.touch ? ((event.clientX - d.x) / box.width) * Math.abs(span) * ax.sign : dir === "x" ? ((event.clientX - d.x) / box.width) * span : ((event.clientY - d.y) / box.height) * span;
  trRequest(trState.axis, d.start + along);
  trRun();
});
trStage.addEventListener("pointerup", trRelease);
trStage.addEventListener("pointercancel", trRelease);
trStage.addEventListener("lostpointercapture", (event) => { if (event.target === trStage) trRelease(event); });
trStage.addEventListener("contextmenu", () => { if (trState.dragging) trRelease({ pointerId: trState.dragging.id }); });
// keyboard focus (not a mouse press) pauses the job while the stage has it
trStage.addEventListener("focus", () => {
  trState.focused = trStage.matches(":focus-visible");
  if (!trState.focused) return;
  if (trState.mode === "sim") trPause({ sticky: false });
  trDescribe();
  trRun();
});
trStage.addEventListener("blur", () => { trState.focused = false; trArmJob(); });
trStage.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const letter = event.key.length === 1 ? event.key.toUpperCase() : "";
  if (TR_AXES[letter]) {
    trSelect(letter);
    event.preventDefault();
    return;
  }
  if (trState.mode === "sim") {
    const step = event.shiftKey ? 5 : 1;
    if (event.key === "ArrowUp" || event.key === "ArrowRight") trSeek(trState.time + step);
    else if (event.key === "ArrowDown" || event.key === "ArrowLeft") trSeek(trState.time - step);
    else if (event.key === "PageUp") trSeek(trNextPass(1));
    else if (event.key === "PageDown") trSeek(trNextPass(-1));
    else if (event.key === "Home") trSeek(0);
    else if (event.key === "End") trSeek(SIM_LEN);
    else if (event.key === " ") { if (trState.playing) trPause(); else { trState.stopped = false; trStartJob(true); } }
    else return;
    event.preventDefault();
    return;
  }
  const ax = TR_AXES[trState.axis];
  const step = event.shiftKey ? ax.big : ax.step;
  if (event.key === "ArrowUp" || event.key === "ArrowRight") trJog(trState.axis, step);
  else if (event.key === "ArrowDown" || event.key === "ArrowLeft") trJog(trState.axis, -step);
  else if (event.key === "PageUp") trJog(trState.axis, ax.big);
  else if (event.key === "PageDown") trJog(trState.axis, -ax.big);
  else if (event.key === "Home") trSetEnd(trState.axis, false);
  else if (event.key === "End") trSetEnd(trState.axis, true);
  else if (event.key === " ") { trState.stopped = false; trState.held = false; trStartJob(true); }
  else if (event.key === "0") {
    trState.want = trHome();
    trState.mWant = 1;
    trDescribe();
    trRun();
  } else return;
  event.preventDefault();
});
trStill.addEventListener("change", (event) => { trCalm = event.matches; if (trCalm) trPause({ sticky: false }); else trArmJob(1400); trRun(); });

// a verification hook: put the job at a time, paused (for stills and video frames)
window.__isoSim = { seek: (time) => { trState.held = false; trState.stopped = true; trSeek(time); trViewGo(trState.viewTo, true); trDraw(); return trState.sim && trState.sim.say; }, view: (i) => trViewGo(i, true) };

trArmJob(1400);
trDescribe();
trDraw();
// the work zone: the disc's centre on screen at home, a little toward the spindle above it
if (trFaceB) { const m = trMatrix(trFaceB); trFocus = [m[4] - 18, m[5] - 8]; }
</script></body></html>
